name: Build and Push Docker Image
run-name: ${{ gitea.actor }} is building swserver 🚀

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 8 * * 1" # weekly rebuild keeps base image + apt packages fresh
  workflow_dispatch:
    inputs:
      push:
        description: "Push image after building"
        type: boolean
        default: false

env:
  IMAGE: gitea.gokickrocks.org/${{ gitea.repository }}

jobs:
  build:
    runs-on: ubuntu-latest # native amd64 runner - no qemu needed
    env:
      DOCKER_HOST: tcp://localhost:2375
      DOCKER_TLS_VERIFY: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Gitea registry
        uses: docker/login-action@v3
        with:
          registry: gitea.gokickrocks.org
          username: ${{ gitea.actor }}
          password: ${{ secrets.PACKAGES_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # git tag v1.2.3 -> 1.2.3, 1.2, 1, latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          # push on version tags, the weekly rebuild, or manual dispatch;
          # plain branch/PR pushes are build-only validation
          push: >-
            ${{ (gitea.event_name == 'push' && startsWith(gitea.ref, 'refs/tags/v')) ||
                gitea.event_name == 'schedule' ||
                (gitea.event_name == 'workflow_dispatch' && gitea.event.inputs.push == 'true') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
