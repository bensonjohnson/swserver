apiVersion: apps/v1
kind: Deployment
metadata:
  name: swserver-deployment
  namespace: game-servers
  labels:
    app: swserver
spec:
  replicas: 1
  # RWO PVCs - never run two pods at once
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: swserver
  template:
    metadata:
      labels:
        app: swserver
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # nodeSelector:
      #   kubernetes.io/arch: amd64
      containers:
      - name: swserver
        image: bensonjohnson/swserver:latest
        imagePullPolicy: Always
        envFrom:
        - secretRef:
            name: steam-credentials
        ports:
        - containerPort: 25564
          protocol: TCP
        - containerPort: 25564
          protocol: UDP
        - containerPort: 25565
          protocol: TCP
        - containerPort: 25565
          protocol: UDP
        - containerPort: 25566
          protocol: TCP
        - containerPort: 25566
          protocol: UDP
        - containerPort: 8080
          protocol: TCP
          name: panel
        readinessProbe:
          tcpSocket:
            port: 25564
          initialDelaySeconds: 60
          periodSeconds: 30
        livenessProbe:
          # panel process being alive is enough; wine hangs are visible in the UI
          tcpSocket:
            port: 8080
          periodSeconds: 30
        resources:
          requests:
            memory: "4Gi"
            cpu: "500m"
          limits:
            memory: "8Gi"
            cpu: "4"
        volumeMounts:
        - mountPath: /home/steam/Steam
          name: steam-login
        - mountPath: /home/steam/steamcmd
          name: steamcmd-client
        - mountPath: /home/steam/.wine
          name: wineprefix
        - mountPath: /home/steam/sw
          name: gamedata
      volumes:
      - name: steam-login
        persistentVolumeClaim:
          claimName: swserver-steam-login-pvc
      - name: steamcmd-client
        persistentVolumeClaim:
          claimName: swserver-steamcmd-pvc
      - name: wineprefix
        persistentVolumeClaim:
          claimName: swserver-wine-pvc
      - name: gamedata
        persistentVolumeClaim:
          claimName: swserver-gamedata-pvc
